<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tachkila Atlas FC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="js/matchs.js" defer></script>
</head>
<body class="bg-slate-900 text-gray-200">
<header class="flex items-center justify-between px-4 py-4 bg-slate-900 border-b border-gray-600">
        <div class="flex items-center gap-3">
        <img src="assets/football.png" alt="Football Icon" class="h-8 w-8 object-contain shrink-0">
        <span class="font-bold text-lime-400 tracking-wide">Atlas FC</span>
        </div>
    <nav class="mx-auto flex items-center gap-4 font-semibold tracking-wider 
    text-sm bg-slate-800 rounded-lg px-1 py-1 text-gray-200">
      <a class="rounded-lg hover:bg-slate-600 py-1 px-1" href="index.html">Effectif</a>
      <a class="rounded-lg hover:bg-slate-600 py-1 px-1" href="composition.html">Composition</a>
      <a class="rounded-lg bg-green-600 text-white py-1 px-1" href="#main-section">Matchs</a>
    </nav>
    <div class="flex items-center ">
      <ul class="flex items-center gap-4 font-semibold tracking-wider text-sm">
        <li class="flex items-center gap-2 text-gray-200">
          <span class="h-3 w-3 bg-yellow-500 rounded-full"></span>
          <span>GB</span>
        </li>
        <li class="flex items-center gap-2 text-gray-200">
          <span class="h-3 w-3 bg-blue-500 rounded-full"></span>
          <span>DEF</span>
        </li>
        <li class="flex items-center gap-2 text-gray-200">
          <span class="h-3 w-3 bg-green-500 rounded-full"></span>
          <span>MIL</span>
        </li>
        <li class="flex items-center gap-2 text-gray-200">
          <span class="h-3 w-3 bg-red-500 rounded-full"></span>
          <span>ATT</span>
        </li>
        </ul>
        </div>
    </header>
       <main class="main-section mt-6 ml-8">
      <section class="flex justify-between items-center">
        <div>
        <h1 class="text-white font-semibold text-3xl my-2">Matchs</h1>
        <p class="text-gray-400 font-medium">Calendrier et resultats de la saison 2026/2027.</p>
        </div>
        <button type="button" class="rounded-lg text-white text-sm font-semibold 
        h-10 w-[200px] bg-green-600 mr-6 mt-8"> + Ajouter un joueur</button>
      </section>
        <nav class="bg-slate-800 rounded-lg w-[98%] h-16 mt-10 flex items-center justify-between gap-3">
          <div class="bg-slate-900 rounded-lg text-xs flex gap-6 text-gray-300 font-semibold mr-4">
            <button type="button" class="m-1 py-2 px-2 hover:bg-slate-600 rounded-md focus:bg-green-600 outline-none">
              Tous <span></span>
            </button>
            <button type="button" class="m-1 py-2 px-2 hover:bg-slate-600 rounded-md focus:bg-green-600 outline-none">
             A venir <span></span>
            </button>
            <button type="button" class="m-1 mr-2 py-2 px-2 hover:bg-slate-600 rounded-md focus:bg-green-600 outline-none">
              Joues <span></span>
            </button>
          </div>
          <input type="text" name="searchBar" id="searchBar" placeholder="Rechercher un joueur par nom..."
          class="bg-slate-900 ml-4 py-2 px-4 border border-gray-600 outline-none rounded-lg w-[76%] text-sm">
        </nav>
        <section id="liste-matchs">
        </section>
    </main>
</body>
</html>
